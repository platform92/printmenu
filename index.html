<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  :root { --ink: #2a1203; --ink-soft: #5a2f10; --card: rgba(255,255,255,0.28); --photo: 58px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { height: 100%; }
  body {
    background: #2b2b2b;
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
  }

  /* Toolbar */
  #bar { height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: center; gap: 28px; }
  #opac { display: flex; align-items: center; gap: 10px; color: #e8e8e8; font: 600 14px "Bricolage Grotesque", system-ui, sans-serif; }
  #opac input { width: 150px; accent-color: #ff914d; cursor: pointer; }
  #opacVal { min-width: 3ch; text-align: right; }
  #pdf {
    font: 800 15px "Bricolage Grotesque", system-ui, sans-serif;
    color: var(--ink); cursor: pointer;
    background: linear-gradient(90deg, #ffde59, #ff914d);
    border: 0; border-radius: 999px; padding: 10px 26px;
  }
  #pdf:hover { filter: brightness(1.06); }
  #pdf:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* A4 page */
  #stage { position: relative; }
  #page {
    width: 210mm; height: 296mm;
    transform-origin: top left;
    background: linear-gradient(90deg, #ffde59, #ff914d);
    padding: 9mm 10mm;
    display: flex; gap: 8mm;
    overflow: hidden;
    position: relative;
  }
  /* Logo watermark: sits behind everything, spans the menu width (page minus side padding) */
  #logo {
    position: absolute; z-index: 0; pointer-events: none;
    left: 10mm; width: 190mm; height: auto;
    top: 50%; transform: translateY(-50%);
    opacity: 0.05;
  }
  .col { position: relative; z-index: 1; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
  h2 { margin-bottom: 8px; line-height: 1; }
  .hl {
    display: inline-block;
    background: #DA291C;           /* McDonald's red */
    color: #fff;
    font-size: 16px; font-weight: 800; letter-spacing: 0.03em;
    padding: 4px 12px 5px;
    border-radius: 6px;
    transform: rotate(-1deg);
    box-shadow: 0 1px 0 rgba(0,0,0,0.12);
  }

  /* Editing */
  [contenteditable] { cursor: text; }
  [contenteditable]:hover { outline: 1px dashed rgba(42,18,3,0.55); outline-offset: 2px; }
  .hl[contenteditable]:hover { outline-color: #fff; }
  [contenteditable]:focus { outline: 2px solid #fff; outline-offset: 2px; }
  .item {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border-radius: 14px;
    padding: 5px 10px 5px 5px; margin-bottom: 6px;
  }
  .photo {
    flex: 0 0 var(--photo); width: var(--photo); height: var(--photo);
    border-radius: 50%; overflow: hidden;
    background: rgba(255,255,255,0.45);
    border: 2px solid rgba(255,255,255,0.85);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo.empty img { display: none; }
  .info { flex: 1; min-width: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
  .price { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
  .desc { margin-top: 2px; color: var(--ink-soft); font-size: 11.5px; line-height: 1.3; }

  @media print {
    html, body { height: auto; overflow: visible; background: none; display: block; }
    #bar { display: none; }
    #stage { width: auto !important; height: auto !important; }
    #page { transform: none !important; }
    [contenteditable] { outline: none !important; }
  }
</style>
</head>

    <span id="opacVal">5%</span>
  </label>
</div>

<script>
const MENU = [
  { title: "TALLRIKAR", items: [
    ["Kyckling", "109 Kr", "Grillad kyckling, med ris eller pommes & sallad."],
    ["Krispig kyckling", "119 Kr", "Krispig kyckling, med ris eller pommes & sallad."],
    ["Smash Nötkött", "119 Kr", "Kryddat nötkött, med ris/pommes & sallad."],
    ["Combo (Nöt & Kyckling)", "119 Kr", "Grillad kyckling & kryddat nötkött, med ris eller pommes & sallad."],
    ["Fisk", "119 Kr", "Panerad fiskfilé, med ris eller pommes & sallad."],
    ["Falafel", "79 Kr", "Krispiga falafflar, med ris eller pommes & sallad."]
  ]},
  { title: "PARATHAS", items: [
    ["Kyckling 65", "89 Kr", "Krispigt marinerad kyckling med indiska kryddor, friterad till perfektion och serverad", "a"],
    ["Kyckeling 555", "99 Kr", "Krispiga kycklingbitar marinerade med smakrika och serverade med en krämig sås.", "b"]
  ]},
  { title: "RULLE", items: [
    ["Nötkött rulle", "119 Kr", "Kryddat nötkött i varmt pitabröd med sallad & mild sås."],
    ["Kyckling rulle", "99 Kr", "Grillad kyckling i varmt pitabröd med sallad."],
    ["Falafel rulle", "79 Kr", "Falafel med färska grönsaker."]
  ]},
  { title: "HAMBURGARE", items: [
    ["Cheeseburgare", "119 Kr", "Nötköttsburgare grillad till perfektion, toppad med smält ost, serveras med pommes."],
    ["Krispig kyckling-cheeseburgare", "119 Kr", "Krispigt friterad till gyllene perfektion, med smält ost, serveras med pommes."],
    ["Fisk Burger", "119 Kr", "FiskBurger."]
  ]},
  { title: "SALLAD", items: [
    ["Mixed Sallad", "69 Kr / 99 Kr", "Kyckling / Nötkött, Isbergssallad, Fetaost, gurka, tomat, kidneybönor, med mild dressing."]
  ]},
  { title: "POMMES FRITES", items: [
    ["Pommes", "39 Kr", "Krispiga pommes."],
    ["Loaded Pommes", "69 Kr", "Krispiga pommes toppade med valfri dressing."],
    ["Pommes med ost", "59 Kr", "Krispiga pommes/falafel med färska grönsaker & valfri sås."]
  ]},
  { title: "KYCKLING", items: [
    ["Nuggets", "49 Kr", "Krispiga, med mild dippsås."],
    ["Kycklingvingar", "49 Kr", "Saftiga & krispiga, med mild dippsås."]
  ]},
  { title: "DRYCKER", items: [
    ["Dryck", "25 Kr", "Välj mellan läsk, kaffe/te, serveras iskallt/varmt efter val."]
  ]},
  { title: "MILKSHAKES", items: [
    ["Välja", "49 Kr", "Banan, Jordgubbe, Blandade Bär, Banan- och dadel, Mango, & Oreo Shake."]
  ]}
];

// Photos: ./photos/1.jpg, 2.jpg ... numbered in menu order (top to bottom, left column then right column)
const EXTS = ["jpg", "jpeg", "png", "webp"];
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

let n = 0;
const sectionHTML = sec => `
  <section>
    <h2><span class="hl" contenteditable="true">${esc(sec.title)}</span></h2>
    ${sec.items.map(([name, price, desc, id]) => {
      if (!id) n++;
      const pid = id || n;
      return `
      <div class="item">
        <div class="photo empty" data-n="${pid}"><img alt="${esc(name)}"></div>
        <div class="info">
          <div class="row"><span class="name" contenteditable="true">${esc(name)}</span><span class="price" contenteditable="true">${esc(price)}</span></div>
          <p class="desc" contenteditable="true">${esc(desc)}</p>
        </div>
      </div>`;
    }).join("")}
  </section>`;

document.getElementById("left").innerHTML  = MENU.slice(0, 3).map(sectionHTML).join("");
document.getElementById("right").innerHTML = MENU.slice(3).map(sectionHTML).join("");

document.querySelectorAll(".photo").forEach(box => {
  const img = box.querySelector("img");
  let i = 0;
  img.onload = () => box.classList.remove("empty");
  img.onerror = () => { i++; if (i < EXTS.length) img.src = `photos/${box.dataset.n}.${EXTS[i]}`; };
  img.src = `photos/${box.dataset.n}.${EXTS[0]}`;
});

// Fit the A4 page inside the window so nothing scrolls
const stage = document.getElementById("stage");
const page = document.getElementById("page");
function fit() {
  page.style.transform = "none";
  const w = page.offsetWidth, h = page.offsetHeight;
  const s = Math.min((innerWidth - 24) / w, (innerHeight - 56 - 12) / h, 1);
  page.style.transform = `scale(${s})`;
  stage.style.width = w * s + "px";
  stage.style.height = h * s + "px";
}
addEventListener("resize", fit);
addEventListener("load", fit);
fit();

const logo = document.getElementById("logo");
const range = document.getElementById("opacRange");
const val = document.getElementById("opacVal");
range.addEventListener("input", () => {
  logo.style.opacity = range.value / 100;
  val.textContent = range.value + "%";
});

document.body.spellcheck = false;
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.isContentEditable) { e.preventDefault(); e.target.blur(); }
});
document.addEventListener("paste", e => {
  if (!e.target.isContentEditable) return;
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ");
  document.execCommand("insertText", false, t);
});

document.getElementById("pdf").addEventListener("click", () => window.print());
</script>
</body>
</html>
