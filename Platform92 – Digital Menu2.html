for (const k in T) { T[k].t = T[k].t.split("|"); T[k].w = T[k].w.split("|"); T[k].d = T[k].d.split("|"); }

];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const sel = $("lang"), nav = $("nav"), menu = $("menu");
sel.innerHTML = Object.keys(T).map(k => `<option value="${k}">${T[k].n}</option>`).join("");

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.rtl ? "rtl" : "ltr";
  sel.value = lang;
  nav.innerHTML = S.map((s, i) => `<a href="#s${i}" data-i="${i}">${s[0]} ${esc(t.t[i])}</a>`).join("");
  menu.innerHTML = S.map((s, i) => `
    <section id="s${i}">
      <h2><span>${s[0]}</span>${esc(t.t[i])}</h2>
      ${s[2] ? `<div class="hours"><div><b>${esc(t.wk)}</b><span>14:00–17:00</span></div><div><b>${esc(t.we)}</b><span>12:00–17:00</span></div></div>` : ""}
      ${s[1].map(([n, p, d, hot]) => `
      <article class="item">
        <div class="row"><div class="nm">${esc(n)}${hot ? `<span class="pop">${esc(t.pop)}</span>` : ""}</div><div class="price">${esc(p)}</div></div>
        <p class="desc">${esc(Array.isArray(d) ? d.map(j => t.w[j]).join(" · ") : t.d[d])}</p>
      </article>`).join("")}
    </section>`).join("");
  observe();
  sizeBar();
}

function sizeBar() { document.documentElement.style.setProperty("--h", ($("top").offsetHeight + 8) + "px"); }
let io;
function observe() {
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const a = nav.querySelector(`[data-i="${e.target.id.slice(1)}"]`);
    nav.querySelectorAll("a.on").forEach(x => x.classList.remove("on"));
    a.classList.add("on");
    const r = a.getBoundingClientRect(), nr = nav.getBoundingClientRect();
    if (r.left < nr.left || r.right > nr.right) nav.scrollTo({ left: nav.scrollLeft + r.left - nr.left - 16, behavior: "smooth" });
  }), { rootMargin: "-35% 0px -60% 0px" });
  menu.querySelectorAll("section").forEach(s => io.observe(s));
}

sel.addEventListener("change", () => { render(sel.value); try { localStorage.setItem("lang", sel.value); } catch (e) {} });
addEventListener("resize", sizeBar);

let start = "sv";
try { start = localStorage.getItem("lang") || ""; } catch (e) {}
if (!T[start]) start = (navigator.language || "sv").slice(0, 2).toLowerCase();
if (!T[start]) start = "sv";
render(start);
